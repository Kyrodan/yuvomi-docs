name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: docusaurus

      - name: Compute site URL and base URL
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner_name="${GITHUB_REPOSITORY_OWNER}"

          if [[ -z "${DOCS_SITE_URL}" ]]; then
            DOCS_SITE_URL="https://${owner_name}.github.io"
          fi

          if [[ -z "${DOCS_BASE_URL}" ]]; then
            if [[ "${repo_name,,}" == "${owner_name,,}.github.io" ]]; then
              DOCS_BASE_URL="/"
            else
              DOCS_BASE_URL="/${repo_name}/"
            fi
          fi

          echo "DOCS_SITE_URL=${DOCS_SITE_URL}" >> "${GITHUB_ENV}"
          echo "DOCS_BASE_URL=${DOCS_BASE_URL}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
